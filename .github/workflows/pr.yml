name: Pull-Request

on: pull_request

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.3
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'        
      - name: Restore packages
        run: nuget restore
      - name: Apply ImageSharp License
        id: sixlabors
        run: |
          echo "${{secrets.IMAGESHARP_LICENSE}}" > sixlabors.lic
          echo "license=$((Resolve-Path sixlabors.lic).Path)" >> $env:GITHUB_OUTPUT
      - name: Build
        run: dotnet build "--property:SixLaborsLicenseFile=${{steps.sixlabors.outputs.license}}"
      - name: Test
        run: dotnet test --no-build --verbosity normal 

